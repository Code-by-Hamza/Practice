<html>
    <head>
        <title>Color Picker</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="index.css" />
    </head>
    <body>
        <header>
            <h1>Color Picker</h1>
            <form id="input-form">
                <input type="color" name="color" />
                <select class="options" 
                name="mode">
                    <option value="monochrome">Monochrome</option>
                    <option value="monochrome-dark">Monochrome Dark</option>
                    <option value="monochrome-light">Monochrome Light</option>
                    <option value="analogic">Analogic</option>
                    <option value="complement">Complement</option>
                    <option value="analogic-complement">
                        Analogic Complement
                    </option>
                    <option value="triad">Triad</option>
                    <option value="quad">Quad</option>
                </select>
                <button type="submit">Get Color Scheme</button>
            </form>
        </header>
        <main>
            <div class="color-container">
                <div id="color1" class="color"></div>
                <div id="color2" class="color"></div>
                <div id="color3" class="color"></div>
                <div id="color4" class="color"></div>
                <div id="color5" class="color"></div>
                <div id="color6" class="color"></div>
            </div>
        </main>
        <div class="box"></div>
        <script src="index.js"></script>
    </body>
</html>
