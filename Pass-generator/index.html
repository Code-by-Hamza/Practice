<html>

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,800;1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="main-body">
        <div id="heading">
            <h1>Generate a</h1>
            <h1 id="line2">Random Password</h1>
        </div>
        <p>Never use an insecure password again.</p>
        <div class="btn-container">
            <button id="generate" class="btn">Generate Passwords</button>
            <button id="icon" class="btn"><img src="icons/reload.png" alt="Reload" class="btn-icon"></button>
        </div>
        <div class="container">
            <span class="options">Include Symbols</span>
            <label class="switch">
                <input id="symbols" type="checkbox">
                <span class="slider round"></span>
            </label>
        </div>
        <div class="container">
            <span class="options">Include Digits</span>
            <label class="switch">
                <input id="numbers" type="checkbox">
                <span class="slider round"></span>
            </label>
        </div>
        <div class="container">
            <label for="pass-length" class="options">Password length</label>
            <div class="slider-container">
                <input type="range" id="length-slider" min="1" max="3" step="1" value="2">
                <div class="slider-labels">
                    <span id="label-8">8</span>
                    <span id="label-12">12</span>
                    <span id="label-16">16</span>
                </div>
            </div>
        </div>
        <p id="line"></p>
        <div class="password">
            <span id="box1" class="box"></span>
            <span id="box2" class="box"></span>
        </div>

        <script src="main.js"></script>
    </div>

</body>

</html>
