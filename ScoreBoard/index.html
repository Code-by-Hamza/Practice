<html>

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Honk:MORF@15&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="container-two">
        <div>
            <h3 class="heading">Timer</h3>

        </div>
        <div>
            <h1 id="timer">30 : 00</h1>
        </div>
    </div>
    <div class="container">
        <div>
            <h3>HOME</h3>
        </div>
        <div>
            <h3>GUEST</h3>
        </div>
    </div>
    <div class="container">
        <div>
            <h3 id="home-score" class="display">
                0
            </h3>
        </div>
        <div>
            <h3 id="guest-score" class="display">
                0
            </h3>
        </div>
    </div>
    <div class="container">
        <div>
            <button class="buttons-a" onclick="addScore('home', 1)">+1</button>
            <button class="buttons-a" onclick="addScore('home', 2)">+2</button>
            <button class="buttons-a" onclick="addScore('home', 3)">+3</button>
        </div>
        <div>
            <button class="buttons-a" onclick="addScore('guest', 1)">+1</button>
            <button class="buttons-a" onclick="addScore('guest', 2)">+2</button>
            <button class="buttons-a" onclick="addScore('guest', 3)">+3</button>
        </div>
    </div>
    <div class="container-two">
        <button id="start-btn" class="buttons-b" onclick="startTimer()">Start Game</button>
        <button id="new-game" class="buttons-b" onclick="newGame()">New Game</button>
    </div>
    <script src="index.js"></script>
</body>

</html>
