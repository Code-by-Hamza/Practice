<html>

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <hero id="upper-part" class="container">
            <span id="heading">Metric/Imperial Unit Conversion</span>
            <span id="input-box"><input id="input-el" type="number" min="0" max="99"></span>
            <button id="convert-btn">Convert</button>
        </hero>
        <div id="lower-part" class="container">
            <div class="rectangle">
                <h3>
                    Length (Meter/Feet)
                </h3>
                <span id="length-el" class="result">
                    00 meters = 0.000 feet | 00 feet = 0.000 meters
                </span>
            </div>
            <div class="rectangle">
                <h3>
                    Volume (Liters/Gallons)
                </h3>
                <span id="volume-el" class="result">
                    00 liters = 0.000 gallons | 00 gallons = 0.000 liters
                </span>
            </div>
            <div class="rectangle">
                <h3>
                    Mass (Kilograms/Pounds)
                </h3>
                <span id="mass-el" class="result">
                    00 kilos = 0.000 pounds | 00 pounds = 0.000 kilos
                </span>
            </div>
        </div>
        <script src="main.js"></script>
    </main>

</body>

</html>
