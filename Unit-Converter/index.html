<html>

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="upper-part" class="container">
        <span id="heading">Metric/Imperial Unit Conversion</span>
        <span id="input-box"><input id="input-el" type="number"></span>
        <button id="convert-btn">Convert</button>
    </div>
    <div id="lower-part" class="container">
        <div class="rectangle">
            <h3>
                Length (Meter/Feet)
            </h3>
            <span id="length-el" class="result">
                20 meters = 65.616 feet | 20 feet = 6.096 meters
            </span>
        </div>
        <div class="rectangle">
            <h3>
                Volume (Liters/Gallons)
            </h3>
            <span id="volume-el" class="result">
                20 liters = 5.284 gallons | 20 gallons = 75.708 liters
            </span>
        </div>
        <div class="rectangle">
            <h3>
                Mass (Kilograms/Pounds)
            </h3>
            <span id="mass-el" class="result">
                20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos
            </span>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
